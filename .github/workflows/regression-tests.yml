name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test asynchronous dialogs and connection retry
        run: python tools/regression_tests_async_dialogs.py
      - name: Test existing regressions
        shell: pwsh
        run: |
          python tools/regression_tests_1_2_10.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/regression_tests_1_2_11.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
