name: Tolk bridge (Windows)

# 把 Tolk 的 Windows 构建，按旧客户端认的格式发布成本仓库的 Release，
# 让还在用大佐翻译官的用户点「检查更新」就升级成 Tolk。
# 用本仓库已有的 Secret DZFYQ_UPDATE_PRIVATE_KEY_PEM 重新签名，私钥不出这个仓库。
# 先在 Achordchan/tolk 里运行 Release 工作流，得到 v<版本> 的 Release，再运行本工作流。

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tolk 的版本号（如 2.0.0），对应 Achordchan/tolk 的 v2.0.0 Release
        required: true
        type: string
      force_update:
        description: 在说明里加 update=1（强制更新）
        required: false
        default: false
        type: boolean
      gitee:
        description: 同时镜像到 Gitee（旧客户端 <= 1.2.10 只读 Gitee，需要 Secret GITEE_TOKEN）
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tolk-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      # Tolk 仓库是私有时，在本仓库加一个只读令牌 TOLK_READ_TOKEN；公开后可以不配。
      TOLK_TOKEN: ${{ secrets.TOLK_READ_TOKEN || github.token }}
    steps:
      - name: Check inputs
        env:
          KEY: ${{ secrets.DZFYQ_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号必须是 x.y.z" >&2; exit 1; }
          [ -n "$KEY" ] || { echo "缺少 Secret DZFYQ_UPDATE_PRIVATE_KEY_PEM" >&2; exit 1; }
      - name: Fetch Tolk at the release tag
        uses: actions/checkout@v4
        with:
          repository: Achordchan/tolk
          ref: ${{ env.TAG }}
          token: ${{ env.TOLK_TOKEN }}
          path: tolk
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Download Tolk's Windows files
        env:
          GH_TOKEN: ${{ env.TOLK_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo Achordchan/tolk --dir dist \
            --pattern "dazuofanyiguan_full.for.windows_${VERSION}.zip" --pattern "Tolk-setup-windows_${VERSION}.exe"
          ls -l dist
      - name: Sign with the legacy key and write the notes
        env:
          DZFYQ_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.DZFYQ_UPDATE_PRIVATE_KEY_PEM }}
        working-directory: tolk
        run: |
          set -euo pipefail
          # 自检：签名必须能被旧客户端内置的公钥验证，私钥不对会在这里失败。
          go run ./cmd/tolk-release winsign -legacy -zip "../dist/dazuofanyiguan_full.for.windows_${VERSION}.zip" -version "$VERSION"
          FORCE=""; [ "${{ inputs.force_update }}" = "true" ] && FORCE="-force"
          go run ./cmd/tolk-release notes -version "$VERSION" -changelog CHANGELOG.md \
            -sig-json "../dist/dazuofanyiguan_full.for.windows_${VERSION}.zip.sig.json" $FORCE -out ../dist/release_notes.md
          cat ../dist/release_notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG 已存在，请提升版本号" >&2; exit 1; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tolk $TAG" --notes-file dist/release_notes.md --latest dist/*
      - name: Mirror to Gitee
        if: ${{ inputs.gitee }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        working-directory: tolk
        run: |
          set -euo pipefail
          [ -n "$GITEE_TOKEN" ] || { echo "缺少 Secret GITEE_TOKEN（或取消勾选 gitee）" >&2; exit 1; }
          go run ./cmd/tolk-release gitee -version "$VERSION" -assets ../dist -notes ../dist/release_notes.md -repo dazuofanyiguan
